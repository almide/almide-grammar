name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary from the latest almide release. `cargo install --git`
      # stopped working once the compiler repo became a multi-binary workspace
      # ("multiple packages with binaries found"), and building from source
      # took most of the job anyway.
      - name: Install Almide
        run: |
          set -euo pipefail
          asset=almide-linux-x86_64
          curl -fsSL -o "$asset.tar.gz" \
            "https://github.com/almide/almide/releases/latest/download/$asset.tar.gz"
          tar -xzf "$asset.tar.gz"
          sudo install -m 755 "$asset/almide" /usr/local/bin/almide
          almide --version
      - name: Test
        run: almide test src/
      - name: Generate tree-sitter
        run: almide run src/main.almd -- tree-sitter
      - name: Generate textmate
        run: almide run src/main.almd -- textmate
      - name: Generate rust
        run: almide run src/main.almd -- rust
